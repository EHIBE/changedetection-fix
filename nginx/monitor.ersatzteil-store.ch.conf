# Site config for the nginx that already runs on the server.
#
#   cp monitor.ersatzteil-store.ch.conf /etc/nginx/sites-available/
#   ln -s /etc/nginx/sites-available/monitor.ersatzteil-store.ch.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d monitor.ersatzteil-store.ch     # adds HTTPS + the http->https redirect
#
# The main domain (ersatzteil-store.ch) should go back to serving the shop,
# not the monitoring dashboard.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name monitor.ersatzteil-store.ch;

    # Optional: only allow the office / VPN. Uncomment and add your IPs.
    # allow 203.0.113.10;
    # deny  all;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # The UI uses websockets (socket.io) for live updates
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 300s;
    }
}
